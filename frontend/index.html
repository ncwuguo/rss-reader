<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div id="sidebar">
        <div class="brand">Archive</div>
        <div id="feed-list">
            <div class="feed-group-label">System</div>
            <div class="feed-item active" onclick="loadArticles('all', this, 'All Archive')">All items</div>
            <div class="feed-item" onclick="loadArticles('starred', this, 'Favorites')">Starred</div>
            <div class="feed-group-label">Subscriptions</div>
            <!-- Dynamic feeds here -->
        </div>

        <div id="add-feed-box">
            <input type="text" id="feed-url" placeholder="Paste RSS XML URL...">
            <button class="btn" style="width:100%" onclick="addFeed()">Add Source</button>
        </div>

        <div id="opml-box">
            <button class="btn" style="flex:1; font-size: 0.6rem;"
                onclick="document.getElementById('opml-input').click()">Import</button>
            <button class="btn" style="flex:1; font-size: 0.6rem;" onclick="exportOpml()">Export</button>
            <input type="file" id="opml-input" class="hidden" accept=".opml,.xml" onchange="importOpml(this)">
        </div>
    </div>

    <div id="main">
        <div id="toolbar">
            <div class="view-title-container">
                <span id="current-view-name">All Archive</span>
                <span id="status-text"></span>
            </div>
            <div class="controls">
                <button id="view-list-btn" class="btn active" onclick="setLayout('list')">List</button>
                <button id="view-grid-btn" class="btn" onclick="setLayout('grid')">Grid</button>
                <div style="width: 1rem;"></div>
                <button class="btn" onclick="refreshCurrent()">Sync Current</button>
                <button class="btn" onclick="refreshAll()">Sync All</button>
                <button id="toggle-read-btn" class="btn" onclick="toggleShowRead()">Show Read</button>
            </div>
        </div>
        <ul id="article-list"></ul>
    </div>

    <!-- Reading Modal Component -->
    <div id="reader-modal" class="reader-modal" onclick="if(event.target===this) closeArticleModal()">
        <div class="reader-modal-container">
            <button class="reader-modal-close" onclick="closeArticleModal()" title="Close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="reader-modal-header">
                <div id="reader-modal-meta">
                    <span id="reader-modal-date"></span> &mdash; <span id="reader-modal-feed">Archive</span>
                </div>
                <h1 id="reader-modal-title"></h1>
                <a id="reader-modal-link" href="#" target="_blank" class="reader-modal-external-link">Read Original <svg
                        width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg></a>
            </div>
            <div class="reader-modal-divider"></div>
            <div id="reader-modal-body" class="reader-modal-body"></div>
        </div>
    </div>

    <script src="./js/state.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>

</body>

</html>
